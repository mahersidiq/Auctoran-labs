<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc"><title id="title">Fortivor Supplement Facts — supplied packaging label</title><desc id="desc">Serving size: awaiting confirmation. The supplied label shows 25 servings per container; the final serving count requires confirmation. Declared formula amounts: L-Citrulline 8,000 mg; Beta-Alanine 3,200 mg; Betaine Anhydrous 2,500 mg; Taurine 2,000 mg; L-Tyrosine 1,500 mg; Alpha-GPC (50%) 300 mg; Theobromine 300 mg; Caffeine Anhydrous 300 mg; Guarana Extract (22% Caffeine) 250 mg; Sodium (as Sodium Chloride) 300 mg. Other Ingredients: Citric Acid, Natural &amp; Artificial Flavors, Silicon Dioxide, Sucralose, Acesulfame Potassium, Calcium Silicate.</desc><defs><radialGradient id="paper" cx="20%" cy="20%" r="100%"><stop offset="0" stop-color="#202020"/><stop offset="1" stop-color="#0b0b0c"/></radialGradient></defs><rect width="1200" height="1400" fill="url(#paper)"/><g fill="#e4d8c4" font-family="Arial, Helvetica, sans-serif"><text x="90" y="170" font-size="36" fill="#ccb08a" letter-spacing="7">SUPPLEMENT FACTS</text><text x="90" y="227" font-size="30" >Serving Size: 1 Scoop (18 g)</text><text x="90" y="270" font-size="30" >Servings Per Container: 25</text><path d="M90 296h1020" stroke="#ad9472" stroke-width="2"/><text x="1110" y="339" font-size="27" text-anchor="end">Amount Per Serving</text><path d="M90 364h1020" stroke="#ad9472" stroke-width="1.5"/><text x="90" y="415" font-size="32" >L-Citrulline</text><text x="1110" y="415" font-size="32" text-anchor="end">8,000 mg</text><path d="M90 437h1020" stroke="#ad9472" stroke-width="0.8"/><text x="90" y="478" font-size="32" >Beta-Alanine</text><text x="1110" y="478" font-size="32" text-anchor="end">3,200 mg</text><path d="M90 500h1020" stroke="#ad9472" stroke-width="0.8"/><text x="90" y="541" font-size="32" >Betaine Anhydrous</text><text x="1110" y="541" font-size="32" text-anchor="end">2,500 mg</text><path d="M90 563h1020" stroke="#ad9472" stroke-width="0.8"/><text x="90" y="604" font-size="32" >Taurine</text><text x="1110" y="604" font-size="32" text-anchor="end">2,000 mg</text><path d="M90 626h1020" stroke="#ad9472" stroke-width="0.8"/><text x="90" y="667" font-size="32" >L-Tyrosine</text><text x="1110" y="667" font-size="32" text-anchor="end">1,500 mg</text><path d="M90 689h1020" stroke="#ad9472" stroke-width="0.8"/><text x="90" y="730" font-size="32" >Alpha-GPC (50%)</text><text x="1110" y="730" font-size="32" text-anchor="end">300 mg</text><path d="M90 752h1020" stroke="#ad9472" stroke-width="0.8"/><text x="90" y="793" font-size="32" >Theobromine</text><text x="1110" y="793" font-size="32" text-anchor="end">300 mg</text><path d="M90 815h1020" stroke="#ad9472" stroke-width="0.8"/><text x="90" y="856" font-size="32" >Caffeine Anhydrous</text><text x="1110" y="856" font-size="32" text-anchor="end">300 mg</text><path d="M90 878h1020" stroke="#ad9472" stroke-width="0.8"/><text x="90" y="919" font-size="32" >Guarana Extract (22% Caffeine)</text><text x="1110" y="919" font-size="32" text-anchor="end">250 mg</text><path d="M90 941h1020" stroke="#ad9472" stroke-width="0.8"/><text x="90" y="982" font-size="32" >Sodium (as Sodium Chloride)</text><text x="1110" y="982" font-size="32" text-anchor="end">300 mg</text><path d="M90 1004h1020" stroke="#ad9472" stroke-width="0.8"/><path d="M90 1048h1020" stroke="#ad9472" stroke-width="2"/><text x="90" y="1102" font-size="28" >Other Ingredients: Citric Acid, Natural &amp; Artificial Flavors,</text><text x="90" y="1145" font-size="28" >Silicon Dioxide, Sucralose, Acesulfame Potassium, Calcium</text><text x="90" y="1188" font-size="28" >Silicate.</text></g></svg>
