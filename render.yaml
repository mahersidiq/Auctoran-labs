# One-click deploy on Render: Dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: auctoran-labs
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "true"
      - key: STORE_LIVE
        value: "false"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SHIP_US_CENTS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: ORDER_NOTIFY_URL
        sync: false
